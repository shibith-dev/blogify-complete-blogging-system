{% extends 'base.html' %}

{% block content %}

<div class="row">
    <!-- Left sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">
        <h4>All Categories</h4>
        <a href="{% url 'dashboard_add_category' %}" class="btn btn-dark text-light float-right mb-2">Add Category</a>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Category Name</th>
                    <th scope="col">Created At</th>
                    <th scope="col">Updated At</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <th scope="row">{{ forloop.counter }}</th>
                    <td>{{cat.category_name}}</td>
                    <td>{{cat.created_at}}</td>
                    <td>{{cat.updated_at}}</td>
                    <td style="display: flex;">
                        <a href="{% url 'dashboard_edit_category' id=cat.id %}" style="margin-right: 5px;"><i class="fa-solid fa-pen-to-square text-success"></i></a>
                        <a href="{% url 'dashboard_delete_category' id=cat.id %}" onclick="return confirm('Are you sure you want to delete this item?');"><i class="fa-solid fa-trash text-danger"></i></a>
                    </td>
                </tr>
                {% endfor %}

            </tbody>
        </table>
    </div>
</div>

{% endblock %}

{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    {% include 'dashboard/sidebar.html' %}

    <div class="col-md-9 dashboard-form-area">
        <h3>Edit Category</h3>
        <form action="{% url 'dashboard_edit_category' id=category.id %}" method="POST" style="width: 500px;">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Edit</button>
        </form>
    </div>
</div>

{% endblock %}

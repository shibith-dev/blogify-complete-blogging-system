{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<h3 class="text-center" style="margin-top: 30px;" >Login</h3>
<form action="{% url 'login' %}" method="POST" class="login-form">
    {% csrf_token %}
    {{ form | crispy}}
    <button type="submit" class="btn btn-warning">Login</button>
</form>


{% endblock %}
